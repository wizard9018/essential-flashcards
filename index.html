<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Essential Words Flashcards</title>
<style>
:root{--bg:#f6f3ec;--ink:#1f2a37;--mute:#6b7280;--card:#fff;--line:#e4ded0;--accent:#2f5d50;--ok:#2f8f5b;--bad:#c2512f}
@media(prefers-color-scheme:dark){:root{--bg:#15191d;--ink:#e9e6df;--mute:#98a1ab;--card:#1e242a;--line:#2d353d;--accent:#7cc2a8;--ok:#5fd08e;--bad:#f08a66}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin:0;flex:1}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile{text-align:left;padding:14px;border-radius:12px;display:block;width:100%}
.tile b{font-size:17px}.tile small{display:block;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.crumb{color:var(--mute);margin:0 0 14px}
.scene{perspective:1200px;margin:10px 0 16px}
.card{position:relative;height:340px;transform-style:preserve-3d;transition:transform .45s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.back{transform:rotateY(180deg)}
.word{font-size:clamp(34px,8vw,56px);font-weight:700;letter-spacing:.01em}
.pos{color:var(--mute);font-style:italic;margin-top:6px}
.def{font-size:20px}.ex{color:var(--mute);margin-top:14px;font-style:italic}
.ex mark,.def mark{background:none;color:var(--accent);font-weight:700}
.hint{position:absolute;bottom:12px;font-size:13px;color:var(--mute)}
.spk{position:absolute;top:10px;right:10px;padding:6px 10px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.row button{min-width:110px}
.ok{border-color:var(--ok);color:var(--ok)}.no{border-color:var(--bad);color:var(--bad)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.badge{position:absolute;top:12px;left:14px;font-size:13px}
.list td,.list th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.list{width:100%;border-collapse:collapse;margin-top:18px;font-size:14px}
.ubanner{display:flex;justify-content:space-between;color:#fff;padding:12px 16px;border-radius:12px;margin:22px 0 14px}
.snake{position:relative;width:276px;height:276px;margin:0 auto}
.snake svg{position:absolute;inset:0}
.node{position:absolute;transform:translate(-50%,-50%);width:76px;height:76px;border-radius:50%;background:var(--c);color:#fff;border:0;border-bottom:6px solid rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.node span{font-size:24px;font-weight:700}.node small{font-size:10px;letter-spacing:1px}
.node.done{box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--c)}
.node.review{border-radius:22px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:20px;max-width:340px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.qtop{display:flex;align-items:center;gap:12px}.qtop button{padding:4px 10px}
.qbar{flex:1;height:14px;background:var(--line);border-radius:7px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.qbody{min-height:360px;padding:26px 0}
.qsub{color:var(--mute);margin-bottom:10px}.qp{font-size:22px;margin-bottom:22px}.qp.big{font-size:40px;font-weight:700}
.spk2{padding:2px 8px;vertical-align:middle}
.opts{display:grid;gap:10px}
.opt{text-align:left;padding:14px;border-width:2px;border-bottom-width:4px;font-size:17px}
.opt b{display:inline-block;width:26px;color:var(--mute)}
.opt.right{border-color:var(--ok);background:rgba(47,143,91,.15)}.opt.wrong{border-color:var(--bad);background:rgba(194,81,47,.15)}
.qfoot{position:sticky;bottom:0;padding:14px 16px;margin:0 -16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.qfoot.fok{background:rgba(47,143,91,.18)}.qfoot.fbad{background:rgba(194,81,47,.18)}
.fb small{color:var(--mute)}
.qend{text-align:center;padding:40px 0}.bigstars{font-size:52px;color:#e0a82e;letter-spacing:6px}
.badge2{font-weight:600;white-space:nowrap}
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px}.stat small{color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:5px;height:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 6px;margin-bottom:6px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:var(--mute)}
.chart i{display:block;width:100%;background:var(--ok);border-radius:3px 3px 0 0;min-height:2px;opacity:.9}
.seg button{padding:3px 10px;border-radius:8px;font-size:13px;margin-left:4px}
.seg button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cn{font-size:30px;font-weight:700;margin-bottom:12px}
.srs{background:var(--card);border:1px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:16px}
.fld{font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:100%}
.cgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px;min-height:150px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:center}
.fc .w{font-size:24px;font-weight:700}.fc .p{color:var(--mute);font-style:italic;font-size:13px}
.fc .bk{display:none;text-align:left}.fc.flip{border-color:var(--accent);justify-content:flex-start}.fc.flip .ft{display:none}.fc.flip .bk{display:block}
.fc .spk{top:6px;right:6px;padding:2px 7px;font-size:13px}
.rv{background:var(--card);border:1px solid var(--line);border-left-width:5px;border-radius:12px;padding:12px 14px;margin-bottom:12px}
.rvok{border-left-color:var(--ok)}.rvbad{border-left-color:var(--bad)}
.rvp{font-size:18px;font-weight:600;margin:4px 0 8px}
.rvo{padding:6px 10px;border-radius:8px;margin-bottom:4px;font-size:15px}
.rvo.right{background:rgba(47,143,91,.15)}.rvo.wrong{background:rgba(194,81,47,.15)}
.rve mark{background:none;color:var(--accent);font-weight:700}
.rve{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 0 10px;margin-bottom:6px;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border-radius:999px;padding:7px 14px;font-size:14px;white-space:nowrap}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1 id="title">Essential Words Flashcards</h1><span id="streakBadge" class="badge2"></span><span id="userChip" class="badge2"></span><span id="syncChip" class="badge2" style="font-weight:400;font-size:12px;color:var(--mute)"></span><button id="homeBtn" class="hidden">Home</button></header>
<main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js?v=1"></script>
<script src="deck.js?v=3"></script>
<script src="cn.js?v=3"></script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
let USER="";try{USER=localStorage.getItem("ef.user")||""}catch(e){}
const P=k=>"ef."+USER+"."+k;
const jget=(k,d)=>{try{return JSON.parse(localStorage.getItem(P(k))||"null")||d}catch(e){return d}};
const jset=(k,v)=>{try{lsSet(P(k),JSON.stringify(v))}catch(e){}};

const sb=(window.supabase&&window.SB_CFG&&SB_CFG.url)?supabase.createClient(SB_CFG.url,SB_CFG.key):null;
let SBMODE=false;try{SBMODE=!!sb&&localStorage.getItem("ef.sb")==="1"}catch(e){}
let syncTimer=null,syncUid=null;
function setSync(t){const e=document.getElementById("syncChip");if(e)e.textContent=t}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}if(SBMODE)scheduleSync()}
function scheduleSync(){clearTimeout(syncTimer);syncTimer=setTimeout(syncPush,2000);setSync("☁ …")}
const snapshot=()=>({progress,quiz:qprog,wrong,days,chap,tests});
function mergeState(a,b){   // a = remote, b = local (local wins plain conflicts)
  const o={};
  o.progress=Object.assign({},a.progress||{},b.progress||{});
  o.quiz=Object.assign({},a.quiz||{});for(const k in (b.quiz||{}))o.quiz[k]=Math.max(o.quiz[k]||0,b.quiz[k]);
  o.wrong=Object.assign({},a.wrong||{},b.wrong||{});
  o.days=Object.assign({},a.days||{});for(const k in (b.days||{}))o.days[k]=Math.max(o.days[k]||0,b.days[k]);
  o.chap=Object.assign({},a.chap||{});for(const k in (b.chap||{})){const x=o.chap[k],y=b.chap[k];
    o.chap[k]=!x?y:((y.reviews.length>x.reviews.length||(y.reviews.length===x.reviews.length&&y.step>=x.step))?y:x)}
  const seen=new Set(),ts=[];for(const t of [...(a.tests||[]),...(b.tests||[])]){const id=[t.k,t.d,t.pct,t.type].join("|");if(!seen.has(id)){seen.add(id);ts.push(t)}}
  o.tests=ts;return o
}
function applyState(o){
  progress=o.progress;qprog=o.quiz;wrong=o.wrong;days=o.days;chap=o.chap;tests=o.tests;
  store.set(progress);qstore.set(qprog);wstore.set(wrong);dstore.set(days);saveChap();saveTests()
}
async function syncPush(){
  if(!SBMODE||!syncUid)return;
  const {error}=await sb.from("ef_state").upsert({user_id:syncUid,data:snapshot(),updated_at:new Date().toISOString()});
  setSync(error?"☁ ✕ (retrying later)":"☁ synced");if(error)console.warn(error.message)
}
async function syncPull(){
  setSync("☁ …");
  const {data:{session}}=await sb.auth.getSession();
  if(!session){logoutLocal();return}
  syncUid=session.user.id;
  const {data,error}=await sb.from("ef_state").select("data").eq("user_id",syncUid).maybeSingle();
  if(error){setSync("☁ ✕ "+(/relation|schema|exist/i.test(error.message)?"table missing":"offline"));console.warn(error.message);return}
  const merged=mergeState(data?data.data:{},snapshot());
  const changed=JSON.stringify(merged)!==JSON.stringify(snapshot());
  applyState(merged);await syncPush();
  if(changed&&!st&&!qz){badge();home()}
}
function logoutLocal(){try{localStorage.removeItem("ef.user");localStorage.removeItem("ef.sb")}catch(e){}location.reload()}
function loginScreen(){
  let users=[];try{users=JSON.parse(localStorage.getItem("ef.users")||"[]")}catch(e){}
  $("#title").textContent="Essential Words";
  app.innerHTML=`<div class="qend"><h2>👋 Welcome</h2>
  ${sb?`<p class="crumb">Sign in to sync your progress across devices.</p>
  <div style="display:grid;gap:10px;max-width:300px;margin:0 auto 10px"><input id="em" type="email" autocomplete="email" placeholder="Email" class="fld"><input id="pw" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" class="fld">
  <div class="row"><button class="primary" id="si">Sign in</button><button id="su">Create account</button></div><p id="msg" class="crumb" style="min-height:1.4em"></p></div>`:""}
  <p class="crumb" style="margin-top:20px">Or study on this device only (no sync):</p>
  <div class="row" style="margin-bottom:10px">${users.filter(u=>!u.includes("@")).map(u=>`<button data-u="${esc0(u)}">${esc0(u)}</button>`).join("")}</div>
  <div class="row"><input id="nm" placeholder="New name" maxlength="20" class="fld" style="max-width:160px"><button id="newu">Start</button></div></div>`;
  const enter=(n,cloud)=>{n=n.trim();if(!n)return;if(!users.includes(n)){
      if(!users.length)["progress","quiz","wrong","days"].forEach(k=>{const v=localStorage.getItem("ef."+k);if(v!=null)localStorage.setItem("ef."+n+"."+k,v)});
      users.push(n);localStorage.setItem("ef.users",JSON.stringify(users))}
    localStorage.setItem("ef.user",n);if(cloud)localStorage.setItem("ef.sb","1");else localStorage.removeItem("ef.sb");
    localStorage.setItem("ef."+n+".lastLogin",dkeyNow());location.reload()};
  app.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>enter(b.dataset.u,false));
  $("#newu").onclick=()=>enter($("#nm").value,false);$("#nm").onkeydown=e=>{if(e.key==="Enter")enter($("#nm").value,false)};
  if(sb){
    const msg=t=>$("#msg").textContent=t;
    const creds=()=>({email:$("#em").value.trim(),password:$("#pw").value});
    $("#si").onclick=async()=>{const c=creds();if(!c.email||!c.password)return msg("Enter email and password.");msg("Signing in…");
      const {data,error}=await sb.auth.signInWithPassword(c);if(error)return msg(error.message);enter(data.user.email,true)};
    $("#su").onclick=async()=>{const c=creds();if(!c.email||c.password.length<6)return msg("Enter an email and a password of 6+ characters.");msg("Creating account…");
      const {data,error}=await sb.auth.signUp(c);if(error)return msg(error.message);
      if(data.session)return enter(data.user.email,true);
      if(data.user&&data.user.identities&&data.user.identities.length===0){   // email already registered: Supabase sends no email
        msg("This email is already registered. Signing you in…");
        const r=await sb.auth.signInWithPassword(c);
        if(r.error)return msg("This email is already registered — please use Sign in with your existing password.");
        return enter(r.data.user.email,true)}
      msg("Account created. Check your email to confirm, then sign in.")};
    $("#pw").onkeydown=e=>{if(e.key==="Enter")$("#si").click()};
  }
}
const dkeyNow=()=>{const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const esc0=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function logout(){try{if(SBMODE)await sb.auth.signOut()}catch(e){}try{localStorage.removeItem("ef.user");localStorage.removeItem("ef.sb")}catch(e){}location.reload()}

const store={get(){try{return JSON.parse(localStorage.getItem(P("progress"))||"{}")}catch(e){return{}}},set(p){try{lsSet(P("progress"),JSON.stringify(p))}catch(e){}}};
let progress=store.get();           // key "L.word" -> 1 known / 0 learning
const key=(l,w)=>l+"."+w;
const levels=[1,2,3,4,5,6];
const unitsOf=l=>DECK.filter(u=>u.level===l);
const known=ws=>ws.filter(w=>progress[key(w.l,w.w)]===1).length;
DECK.forEach(u=>u.words.forEach(w=>{w.l=u.level;w.cn=(window.CN&&CN[u.level+"."+u.unit]||{})[w.w]||""}));
let lang="en";try{lang=localStorage.getItem("ef.lang")||"en"}catch(e){}
let st=null;


const dstore={get(){try{return JSON.parse(localStorage.getItem(P("days"))||"{}")}catch(e){return{}}},set(p){try{lsSet(P("days"),JSON.stringify(p))}catch(e){}}};
let days=dstore.get();   // "YYYY-MM-DD" -> words practiced that day
const dkey=d=>{const x=d||new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")};
const dayShift=n=>{const d=new Date();d.setDate(d.getDate()+n);return d};
function touchDay(){const k=dkey();days[k]=(days[k]||0)+1;dstore.set(days);badge()}
function streaks(){
  let cur=0,i=days[dkey()]?0:-1;           // today not yet studied: streak still alive through yesterday
  while(days[dkey(dayShift(i))]){cur++;i--}
  const ks=Object.keys(days).sort();let best=0,run=0,prev=null;
  for(const k of ks){const d=new Date(k+"T00:00:00");run=prev&&Math.round((d-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=d}
  return{cur,best,today:!!days[dkey()]}
}
function badge(){const s=streaks();$("#streakBadge").textContent=(s.cur?"🔥 "+s.cur:"");const u=$("#userChip");u.innerHTML=USER?`👤 ${esc0(USER.split("@")[0])} <a href="#" id="lo" style="font-weight:400;font-size:12px">switch</a>`:"";if($("#lo"))$("#lo").onclick=e=>{e.preventDefault();logout()}}
function statsHtml(){
  const s=streaks(),all=DECK.flatMap(u=>u.words);
  const chapters=DECK.filter(u=>stars(u.level+"."+u.unit)).length;
  const starSum=Object.keys(qprog).filter(k=>k!=="xp").reduce((a,k)=>a+qprog[k],0);
  let bars="",mx=Math.max(1,...Array.from({length:14},(_,j)=>days[dkey(dayShift(j-13))]||0));
  for(let j=0;j<14;j++){const d=dayShift(j-13),n=days[dkey(d)]||0;bars+=`<div title="${dkey(d)}: ${n} answers"><i style="height:${100*n/mx*.7}%"></i>${d.getDate()}</div>`}
  return `<div class="stats">
   <div class="stat"><b>🔥 ${s.cur}</b><small>day streak${s.cur&&!s.today?" (study today to keep it!)":""}</small></div>
   <div class="stat"><b>🏅 ${s.best}</b><small>best streak</small></div>
   <div class="stat"><b>⚡ ${xpTotal()}</b><small>XP</small></div>
   <div class="stat"><b>${known(all)}</b><small>of ${all.length} words known</small></div>
   <div class="stat"><b>${chapters}</b><small>of 180 chapters done</small></div>
   <div class="stat"><b>★ ${starSum}</b><small>stars</small></div>
  </div><div class="chart">${bars}</div><p class="crumb" style="font-size:12px;margin:0 0 20px">Last 14 days · answers per day</p>`
}

const INTERVALS=[1,2,4,7,15,30];           // days after learning / after each successful review
let chap=jget("chap",{});                  // "L.n" -> {learned:"YYYY-MM-DD", step:0..6, due:"YYYY-MM-DD", reviews:[{d,pct,ok}]}
let tests=jget("tests",[]);                // [{k,d,pct,type}]
const addDays=(ds,n)=>{const d=new Date(ds+"T00:00:00");d.setDate(d.getDate()+n);return dkey(d)};
const saveChap=()=>jset("chap",chap), saveTests=()=>jset("tests",tests);
function markLearned(l,n){const k=l+"."+n;if(chap[k])return false;chap[k]={learned:dkey(),step:0,due:addDays(dkey(),INTERVALS[0]),reviews:[]};saveChap();return true}
function dueList(){const t=dkey();return Object.keys(chap).filter(k=>chap[k].step<INTERVALS.length&&chap[k].due<=t).sort((a,b)=>chap[a].due.localeCompare(chap[b].due)||a.localeCompare(b,undefined,{numeric:true}))}
function reviewResult(k,pct){
  const c=chap[k];if(!c)return;const ok=pct>=.7;c.reviews.push({d:dkey(),pct:Math.round(pct*100),ok});
  if(ok){c.step++;c.due=c.step<INTERVALS.length?addDays(dkey(),INTERVALS[c.step]):"done"}else{c.step=0;c.due=addDays(dkey(),1)}
  saveChap();return ok
}
let reviewQueue=[];
function startReview(keys){
  reviewQueue=keys.slice();nextReview()
}
function nextReview(){
  const k=reviewQueue.shift();if(!k){home();return}
  const [l,n]=k.split(".").map(Number),u=unitsOf(l).find(x=>x.unit===n);
  startQuiz(l,()=>sample(bank(l,n),10),"Review · L"+l+" Ch."+n,null,k)
}
function scheduleHtml(){
  const due=dueList(),t=dkey();
  const upcoming=Object.keys(chap).filter(k=>chap[k].step<INTERVALS.length&&chap[k].due>t).sort((a,b)=>chap[a].due.localeCompare(chap[b].due)).slice(0,8);
  const lab=k=>{const [l,n]=k.split(".");return "Level "+l+" · Chapter "+n};
  let h=`<div class="srs"><b>🔁 Today's review</b>`;
  if(!Object.keys(chap).length)h+=`<p class="crumb">Finish a chapter's flashcards and it will be scheduled for review (day 1, 2, 4, 7, 15, 30).</p>`;
  else if(!due.length)h+=`<p class="crumb">Nothing due today. 🎉</p>`;
  else h+=`<p class="crumb">${due.length} chapter${due.length>1?"s":""} due: ${due.slice(0,6).map(lab).join(" · ")}${due.length>6?" …":""}</p><button class="primary" id="startRev">Start review (${due.length})</button>`;
  if(upcoming.length)h+=`<p class="crumb" style="margin:10px 0 0;font-size:13px">Coming up: ${upcoming.map(k=>`${lab(k).replace("Level ","L").replace(" · Chapter "," Ch.")} (${chap[k].due.slice(5)})`).join(" · ")}</p>`;
  return h+`</div>`
}
function progressHtml(){
  const learned=Object.keys(chap).length,mastered=Object.values(chap).filter(c=>c.step>=INTERVALS.length).length;
  const revs=Object.values(chap).reduce((a,c)=>a+c.reviews.length,0),ts=tests.filter(x=>x.type==="test");

  <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}"><b>${i+1}</b> ${esc(o)}</button>`).join("")}</div></div>
  <div class="qfoot" id="qf"></div>`;
  $("#qx").onclick=()=>{if(confirm("Quit this lesson?"))level(qz.l)};
  if(q.say)$("#qs").onclick=()=>speak(q.say);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.i===q.a,+b.dataset.i));
  qz.st="ask";
}
function answer(ok,idx){
  if(qz.st!=="ask")return;qz.st="done";
  const q=qz.qs[qz.i];qz.seen++;
  touchDay();recordAnswer(qz.l,q.w,ok);
  if(!q.retry)qz.log.push({q,pick:idx,ok});
  if(ok)qz.right++;else{qz.hearts--;if(!q.retry){qz.qs.push({...q,retry:1})}}
  app.querySelectorAll(".opt").forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add("right");else if(i===idx)b.classList.add("wrong")});
  const ans=q.opts[q.a];
  $("#qf").className="qfoot "+(ok?"fok":"fbad");
  $("#qf").innerHTML=`<div class="fb"><b>${ok?"Correct!":"Correct answer: "+esc(ans)}</b><br><small>${esc(q.w.w)} — ${esc(q.w.d)}</small></div><button class="primary" id="nx">Continue</button>`;
  $("#nx").onclick=qnext;$("#nx").focus();
}
function qnext(){qz.i++;qdraw()}
document.addEventListener("keydown",e=>{
  if(!qz||document.querySelector("dialog[open]"))return;
  if(qz.st==="ask"&&/^[1-4]$/.test(e.key)){const b=app.querySelectorAll(".opt")[+e.key-1];if(b)b.click()}
  else if(qz.st==="done"&&e.key==="Enter"&&document.activeElement.id!=="nx"){e.preventDefault();qnext()}
});
$("#homeBtn").onclick=()=>{qz=null;home()};
if(!USER)loginScreen();else{try{lsSet(P("lastLogin"),dkeyNow())}catch(e){}badge();home();if(SBMODE)syncPull()}
</script>
</body>
</html>
